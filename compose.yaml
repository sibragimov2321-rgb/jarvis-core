services:
  jarvis:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8000"
    volumes:
      - jarvis_data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    profiles: [vps]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  jarvis_data:
  caddy_data:
  caddy_config:
